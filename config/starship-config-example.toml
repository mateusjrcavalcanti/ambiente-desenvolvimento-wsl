# Configuração Exemplo do Starship Prompt
# Arquivo: ~/.config/starship.toml

"$schema" = 'https://starship.rs/config-schema.json'

# Insere uma linha em branco entre os prompts do shell
add_newline = true

# Substitui o símbolo do prompt
[character]
success_symbol = '[➜](bold green)'
error_symbol = '[➜](bold red)'

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold cyan"

[git_branch]
symbol = "🌱 "
style = "bold purple"

[git_status]
style = "bold red"
format = '([$all_status$ahead_behind]($style) )'

[nodejs]
symbol = "🤖 "
style = "bold green"
format = 'via [$symbol($version )]($style)'

[python]
symbol = "🐍 "
style = "bold yellow"
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[golang]
symbol = "🐹 "
style = "bold cyan"
format = 'via [$symbol($version )]($style)'

[rust]
symbol = "🦀 "
style = "bold red"
format = 'via [$symbol($version )]($style)'

[php]
symbol = "🐘 "
style = "bold blue"
format = 'via [$symbol($version )]($style)'

[docker_context]
symbol = "🐳 "
style = "bold blue"
format = 'via [$symbol$context]($style)'
